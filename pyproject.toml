[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-store-qa"
version = "0.1.0"
description = "Session and evidence API for the ECommerce Store QA agent."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymongo>=4.13,<5",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pyright>=1.1.403,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_store_qa"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.uv]
required-version = "==0.12.18"
